[build]
  command = "npm install --include=dev && npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# Proxy API requests directly to Render backend (prevents CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://codevamp-backend.onrender.com/:splat"
  status = 200
  force = true

# Handle React Router / SPA Routing redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
